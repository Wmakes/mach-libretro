[project]
id = "libretro"
version = "1.0.0"
mach = "^7"
src  = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

[artifact.mach-libretro]
kind = "static"
default = true
export = true
entry = "lib.mach"
out = "{project.work}/lib/mach-libretro{artifact.suffix}"
targets = ["*"]
link = []
need = []

[artifact.tests]
kind = "static"
entry = "test.mach"
out = "{project.work}/lib/tests{artifact.suffix}"
targets = ["*"]
link = []
need = []

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"


[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^10"
